name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Any page resolving "today" at build time freezes on the last commit without
  # this. 07:10 UTC ≈ 03:10 ET.
  schedule:
    - cron: "10 7 * * *"

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22   # the action defaults to 20; Astro 7 needs >=22.12
        env:
          # Optional. Unset is fine — /ask/ falls back to a deterministic
          # summary and still returns correct results.
          PUBLIC_CHAT_ENDPOINT: ${{ vars.PUBLIC_CHAT_ENDPOINT }}
          # Optional. Unset falls back to a prefilled mailto link.
          PUBLIC_REPORT_ENDPOINT: ${{ vars.PUBLIC_REPORT_ENDPOINT }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action gives up after 10 minutes by default. On 6 August 2026
          # both of these sites failed three deploys in a row, every one of
          # them sitting in deployment_queued or deployment_in_progress until
          # that timeout — while GitHub reported Pages fully operational and
          # the artifact was an unremarkable 19MB. Nothing was wrong with the
          # build; the deploy was just slower than the default allows, and a
          # timeout here means the commit is pushed but the site is not live,
          # which is the worst of both. Thirty minutes.
          timeout: 1800000
