<!--
  The mark, in its compact form. See src/components/Logo.astro for why the
  small version drops the outer contours: at 16px every stroke in the full
  drawing is sub-pixel and the browser fades it to a smudge.

  This file previously shipped Astro's stock logo — the site had a starter
  favicon in every browser tab since launch.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="49" fill="#1e2a33"/>
  <path d="M33 64c2-7 6-11 10-14s8-7 12-6 9 6 11 10 4 7 4 12"
        fill="none" stroke="#f2f1ec" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M50 20 L62 41 L38 41 Z" fill="#f2f1ec"/>
  <path d="M11 72h78" stroke="#2f6f7e" stroke-width="9" stroke-linecap="round"/>
</svg>
